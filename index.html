<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="stylesheet" href="style.css?v=3" />
    <title>FitChat (Fitnah Chat)</title>
  </head>

  <body>
    <div id="chat-container">
      <header id="header">
        <div id="header-info">
          <h1>Global Chat Jordan</h1>
          <span id="online-status"><i class="dot"></i>Online</span>
        </div>
        <button id="login-btn" type="button">Login Google</button>
      </header>

      <main id="messages" aria-live="polite"></main>

      <div id="input-area">
        <input
          type="text"
          id="user-name"
          placeholder="Nama kamu"
          autocomplete="nickname"
          maxlength="24"
        />

        <div id="attach-preview" hidden></div>

        <div id="compose">
          <button
            id="attach-btn"
            type="button"
            aria-label="Lampirkan foto atau file"
            hidden
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 11-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"
              />
            </svg>
          </button>
          <input type="file" id="file-input" hidden />
          <input
            type="text"
            id="message-input"
            placeholder="Ketik pesan"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button id="send-btn" type="button" aria-label="Kirim pesan">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Menu hapus pesan -->
    <div id="sheet" hidden>
      <div class="sheet-backdrop" data-tutup></div>
      <div
        class="sheet-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheet-title"
      >
        <p id="sheet-title" class="sheet-title">Opsi pesan</p>
        <p id="sheet-preview" class="sheet-preview"></p>
        <button id="sheet-hapus-saya" type="button">
          <span>Hapus untuk saya</span>
          <small
            >Hanya hilang dari layarmu. Orang lain masih bisa melihatnya.</small
          >
        </button>
        <button id="sheet-hapus-semua" type="button" class="danger">
          <span>Hapus untuk semua orang</span>
          <small
            >Isi pesan dihapus, yang tersisa hanya keterangan "Pesan ini telah
            dihapus".</small
          >
        </button>
        <button id="sheet-batal" type="button" class="plain">Batal</button>
      </div>
    </div>

    <!-- Tampilan gambar penuh -->
    <div id="lightbox" hidden>
      <img id="lightbox-img" alt="" />
    </div>

    <script type="module" src="script.js?v=3"></script>
  </body>
</html>
